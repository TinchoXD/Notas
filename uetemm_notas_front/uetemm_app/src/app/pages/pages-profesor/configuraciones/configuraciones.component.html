<p-toast />
<div class="container-page" [ngClass]="{'dialog-blur': modalVisible }">
    <div class="card card flex flex-wrap gap-3 p-fluid">
        <p>Definir el rango de fechas para el ingreso de calificaciones para cada Aporte</p>
        <div class="grid flex-auto">
            <div class="col-sm">
                <label for="rangeDatesTrimestreI" class="font-bold block mb-2"> Trimestre I </label>
                <p-calendar inputId="rangeDatesTrimestreI" [(ngModel)]="rangeDatesTrimestreI" selectionMode="range"
                    [readonlyInput]="true" [showIcon]="true" [showOnFocus]="false" />
            </div>
            <div class="col-sm">
                <label for="rangeDatesTrimestreII" class="font-bold block mb-2"> Trimestre II </label>
                <p-calendar inputId="rangeDatesTrimestreII" [(ngModel)]="rangeDatesTrimestreII" selectionMode="range"
                    [readonlyInput]="true" [showIcon]="true" [showOnFocus]="false" />
            </div>
            <div class="col-sm">
                <label for="rangeDatesTrimestreIII" class="font-bold block mb-2"> Trimestre III </label>
                <p-calendar inputId="rangeDatesTrimestreIII" [(ngModel)]="rangeDatesTrimestreIII" selectionMode="range"
                    [readonlyInput]="true" [showIcon]="true" [showOnFocus]="false" [locale]="es"></p-calendar>
            </div>
            <div class="col-sm">
                <label for="rangeDatesSupletorio" class="font-bold block mb-2"> Supletorio </label>
                <p-calendar inputId="rangeDatesSupletorio" [(ngModel)]="rangeDatesSupletorio" selectionMode="range"
                    [readonlyInput]="true" [showIcon]="true" [showOnFocus]="false" [locale]="es" />
            </div>
        </div>
        <div mat-dialog-actions align="end" style="text-align: end; justify-content: end;">
            <button mat-flat-button (click)="guardarConfiguracionFechas()" [color]="color" 
                [disabled]="!esFormularioValido()">Guardar</button>
        </div>
    </div>
</div>

<p-dialog [(visible)]="modalVisible" [modal]="true" [closable]="false"
    [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }" [style]="{ width: '25vw' }" [draggable]="false"
    [resizable]="false">
    <ng-template pTemplate="header">
        <div class="inline-flex align-items-center justify-content-center gap-2">
            <i class='pi pi-exclamation-triangle' style='margin-right: 8px; color: orange;'></i>
            <span class="font-bold white-space-nowrap">
                Acceso Denegado
            </span>
        </div>
    </ng-template>
    <p>
        Su rol de usuario no le permite visualizar esta página
    </p>
</p-dialog>
