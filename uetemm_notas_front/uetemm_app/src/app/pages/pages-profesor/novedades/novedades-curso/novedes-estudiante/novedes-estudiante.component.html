

<div class="w-full">

    <p-table #dt [value]="novedades" styleClass="p-datatable-striped p-datatable-sm">
        
        <ng-template pTemplate="header">
            <tr>
                <!--    <th>#</th> -->
                <th>Fecha</th>
                <th>Descripcion</th>
                <th>Profesor</th>
               

            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-novedad let-i="rowIndex">
            <tr style="height: 5vh;">
                <td>{{ novedad.fechaRegistro | date: 'dd/MM/yyyy' }}</td>
                <td>{{ novedad.descripcion }}</td>
                <td>{{ novedad.profesor.firstname}} {{ novedad.profesor.lastname}}</td>
                
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="2">{{noData}}
                <td>
            </tr>
        </ng-template>
    </p-table>
</div>
