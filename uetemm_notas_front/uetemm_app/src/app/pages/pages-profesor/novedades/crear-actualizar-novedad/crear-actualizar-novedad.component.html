<p-toast></p-toast>
<div class="card">


    <form [formGroup]="formNovedad" (ngSubmit)="onSubmit()">


        <input type="text" formControlName="id" class="form-control" readonly hidden>

        <input type="text" formControlName="estudianteId" class="form-control" readonly hidden>

        <input type="text" formControlName="cursoId" class="form-control" readonly hidden>

        <input type="text" formControlName="profesorId" class="form-control" readonly hidden>
        <div class="grid">

            <div class="col-12 md:col-6">

                <mat-form-field style="width: 100%;" appearance="outline">
                    <mat-label>Fecha</mat-label>

                    <input matInput [matDatepicker]="fechaRegistro" formControlName="fechaRegistro" readonly="true">

                    <mat-hint>DD/MM/YYYY</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="fechaRegistro"></mat-datepicker-toggle>
                    <mat-datepicker #fechaRegistro></mat-datepicker>

                    @if (formNovedad.invalid) {
                    <mat-error> Seleccione la fecha en la que se reporta la novedad.</mat-error>
                    }
                </mat-form-field>

            </div>
            <div class="col-12 md:col-6">

                <mat-form-field style="width: 100%;" appearance="outline">
                    <mat-label>Detalle de la novedad</mat-label>
                    <textarea matInput formControlName="descripcion" maxlength="1000"></textarea>
                    @if (formNovedad.invalid) {
                    <mat-error> Escriba el detalle de la novedad</mat-error>
                    }
                </mat-form-field>

            </div>
        </div>
        <div class="flex justify-content-end mt-3">
        </div>




        <div class="grid">
            <div class="col">
                <p-button type="button" label="Cerrar" icon="pi pi-times"
                    (click)="closeDialog({ buttonType: 'Cancel', summary: 'Dialogo Cerrardo' })" />
            </div>
            <div class="col">
                <p-button severity="success" class="" icon label="Guardar" type="submit" icon="pi pi-save"
                    [disabled]="formNovedad.invalid" />
            </div>
            <div class="col" *ngIf="esActualizar">
                <p-button severity="danger" class="" icon="pi pi-trash" label="Eliminar" (click)="eliminar()" />
            </div>
        </div>

            <p-button type="button" label="Cerrar" icon="pi pi-times"
                (click)="closeDialog({ buttonType: 'Cancel', summary: 'Dialogo Cerrardo' })" />
            <p-button severity="success" class="ml-3" icon label="Guardar" type="submit" icon="pi pi-save"
                [disabled]="formNovedad.invalid" />
            <p-button severity="danger" class="ml-3" icon="pi pi-trash" label="Eliminar" (click)="eliminar()" />
        </div> -->


    </form>


</div>
